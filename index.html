<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primera Prueba Front End</title>
    <style>
        /* Estilos generales del cuerpo de la página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #ffffff;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor tipo tarjeta para centrar y estilizar el contenido */
        .card-container {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 800px;
            width: 90%;
        }

        /* Estilos para los títulos */
        h1 {
            font-size: 2.2em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 1px;
        }

        h2 {
            font-size: 1.4em;
            font-weight: 300;
            margin-bottom: 40px;
            color: #b8c6db;
        }

        /* Estilos para convertir el enlace en un botón */
        a {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            border-radius: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        /* Efecto al pasar el mouse por encima del botón */
        a:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.6);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Se mantiene tu estructura original intacta -->
